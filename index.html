<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FULLVIBE ZONE HUB - Streaming Video Viral</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #121526, #08090f);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .screen {
      display: none;
      width: 100%;
    }
    .screen.active {
      display: block;
    }

    /* --- HALAMAN PEMBUKA --- */
    .landing-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 20px;
      margin-top: 15vh;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .landing-title {
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    .landing-desc {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 30px;
    }

    .btn-continue {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #ff007f, #ff758c); /* Gradasi Pink */
      border: none;
      border-radius: 12px;
      color: #fff; /* Teks diubah menjadi putih agar kontras */
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); /* Efek cahaya pink */
      transition: transform 0.2s, filter 0.2s;
    }

    .btn-continue:active {
      transform: scale(0.98);
    }

    .loading-box {
      display: none;
      margin-top: 25px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 242, 254, 0.1);
      border-top: 4px solid #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* --- HALAMAN UTAMA / VIDEO PLAYER --- */
    .header-zone {
      margin-bottom: 20px;
      padding-top: 10px;
    }

    .brand-name {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    .brand-sub {
      font-size: 0.8rem;
      color: #8888a0;
      margin-top: 4px;
      text-transform: lowercase;
    }

    .ads-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      margin: 15px 0;
      min-height: 80px;
      overflow: hidden;
    }

    .ads-label {
      font-size: 0.65rem;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      opacity: 0.8;
      text-align: left;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .btn-fullversion {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #ff007f, #7928ca);
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 10px;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s;
      position: relative;
      z-index: 10;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-fullversion:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 30px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. HALAMAN PEMBUKA -->
    <div id="screen-landing" class="screen active">
      <div class="landing-box">
        <h1 class="landing-title">FULLVIBE ZONE HUB</h1>
        <p class="landing-desc">click the button below to play the video</p>

        <button id="btn-start" class="btn-continue" onclick="triggerLoading()">CONTINUE TO VIDEO</button>

        <div id="loading-box" class="loading-box">
          <div class="spinner"></div>
          <p style="font-size: 0.8rem; color: #00f2fe;">loading Video High Quality...</p>
        </div>
      </div>
    </div>

    <!-- 2. HALAMAN UTAMA / PEMUTAR VIDEO -->
    <div id="screen-main" class="screen">
      
      <div class="header-zone">
        <div class="brand-name">FULLVIBE ZONE HUB</div>
        <div class="brand-sub">watch trending viral video every day.</div>
      </div>

      <!-- NATIVE BANNER ABOVE VIDEO (Dimuat Dinamis) -->
      <div class="ads-card">
        <div class="ads-label">Recommended Videos</div>
        <div style="text-align:center;" id="ad-slot-1"></div>
      </div>

      <!-- Pemutar Video -->
      <div class="video-container">
        <video id="videy-player" controls playsinline preload="metadata">
          <source id="videy-source" src="" type="video/mp4">
          Browser Anda tidak mendukung pemutar video ini.
        </video>
      </div>

      <!-- NATIVE BANNER BELOW VIDEO (Dimuat Dinamis) -->
      <div class="ads-card">
        <div class="ads-label">Recommended Videos</div>
        <div style="text-align:center;" id="ad-slot-2"></div>
      </div>

      <a href="https://www.facebook.com/groups/foundyourgirl" id="btn-full" class="btn-fullversion" target="_blank">
        🔥 WATCH FULL VERSION (HD)
      </a>

      <footer>
        &copy; 2026 VIBE ZONE HUB. All rights reserved.
      </footer>
    </div>

  </div>

  <script>
    // Anti Klik Kanan & Inspect Element
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
      }
    });

    const DEFAULT_VIDEY_ID = "c89sL2uO"; 
    const FULL_VERSION_URL = "https://example.com"; 

    const urlParams = new URLSearchParams(window.location.search);
    const videyId = urlParams.get('v') || DEFAULT_VIDEY_ID;

    const videoSource = document.getElementById('videy-source');
    videoSource.src = `https://cdn.videy.co/${videyId}.mp4`;
    document.getElementById('videy-player').load();
    document.getElementById('btn-full').href = FULL_VERSION_URL;

    // Transisi dengan Jeda 3 Detik + Memuat Iklan Secara Dinamis
    function triggerLoading() {
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('loading-box').style.display = 'block';

      setTimeout(function() {
        document.getElementById('screen-landing').classList.remove('active');
        document.getElementById('screen-main').classList.add('active');

        // PANGGIL SCRIPT IKLAN KETIKA HALAMAN UTAMA SUDAH MUNCUL
        loadAds();
      }, 3000); 
    }

   function loadAds() {      
      // Slot Iklan 1 (Atas Video - Diperbarui)      
      const slot1 = document.getElementById('ad-slot-1');      
      if (slot1.innerHTML === "") {        
        const s1 = document.createElement('script');        
        s1.async = true;        
        s1.dataset.cfasync = "false";        
        s1.src = "https://kr.sayyidvanglo.com/ta8Y7TYq8a6/160136";        
        slot1.appendChild(s1);      
      }

      // Slot Iklan 2 (Bawah Video)
      const slot2 = document.getElementById('ad-slot-2');
      if (slot2.innerHTML === "") {
        const s2 = document.createElement('script');
        s2.async = true;
        s2.dataset.cfasync = "false";
        s2.src = "https://jj.cooleyshivery.com/t6BIHHqPVYvEPloTp/158394";
        slot2.appendChild(s2);
      }
    }
  </script>

</body>
</html>
